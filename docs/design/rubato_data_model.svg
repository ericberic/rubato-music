<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <defs>
    <marker id="s" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/>
    </marker>
    <marker id="d" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Rubato — Data Model (Star Design)</text>

  <!-- CENTER -->
  <ellipse cx="380" cy="230" rx="90" ry="55" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
  <text x="380" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Global Timeline</text>
  <text x="380" y="236" text-anchor="middle" font-size="11" fill="#92400e">(measure, beat)</text>
  <text x="380" y="251" text-anchor="middle" font-size="9" fill="#a16207">universal coordinate</text>

  <!-- SOURCE OF TRUTH (left) -->
  <!-- score.mxl -->
  <rect x="10" y="30" width="145" height="66" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="83" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#111">score.mxl</text>
  <text x="83" y="67" text-anchor="middle" font-size="9" fill="#333">tempo map, measures</text>
  <text x="83" y="81" text-anchor="middle" font-size="9" fill="#333">key/time signatures</text>
  <text x="83" y="93" text-anchor="middle" font-size="8" fill="#1d4ed8" font-weight="700">SOURCE OF TRUTH</text>
  <line x1="155" y1="63" x2="292" y2="198" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="195" y="140" font-size="8" fill="#1d4ed8">tick→(m,b)</text>

  <!-- score.mid -->
  <rect x="10" y="152" width="145" height="56" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="83" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="#111">score.mid</text>
  <text x="83" y="188" text-anchor="middle" font-size="9" fill="#333">orchestral playback</text>
  <text x="83" y="200" text-anchor="middle" font-size="8" fill="#1d4ed8" font-weight="700">SOURCE OF TRUTH</text>
  <line x1="155" y1="178" x2="292" y2="225" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="185" y="208" font-size="8" fill="#1d4ed8">via tempo map</text>

  <!-- score.pdf -->
  <rect x="10" y="258" width="145" height="56" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="83" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#111">score.pdf</text>
  <text x="83" y="294" text-anchor="middle" font-size="9" fill="#333">display surface</text>
  <text x="83" y="306" text-anchor="middle" font-size="8" fill="#1d4ed8" font-weight="700">SOURCE OF TRUTH</text>
  <line x1="155" y1="280" x2="291" y2="252" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="165" y="263" font-size="8" fill="#1d4ed8">via measure_boxes</text>

  <!-- takes store -->
  <rect x="10" y="368" width="145" height="70" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="83" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#111">takes store</text>
  <text x="83" y="405" text-anchor="middle" font-size="9" fill="#333">raw Yamaha MIDI</text>
  <text x="83" y="419" text-anchor="middle" font-size="9" fill="#333">raw / aligned status</text>
  <text x="83" y="430" text-anchor="middle" font-size="8" fill="#1d4ed8" font-weight="700">SOURCE OF TRUTH</text>
  <line x1="155" y1="390" x2="292" y2="262" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="148" y="348" font-size="8" fill="#1d4ed8">aligned→(m_start,m_end)</text>

  <!-- DERIVED (right) -->
  <!-- measure_boxes.json -->
  <rect x="605" y="30" width="148" height="70" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="679" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#111">measure_boxes.json</text>
  <text x="679" y="67" text-anchor="middle" font-size="9" fill="#333">(page,x,y)↔(m,b)</text>
  <text x="679" y="81" text-anchor="middle" font-size="9" fill="#333">from score.mxl + PDF</text>
  <text x="679" y="93" text-anchor="middle" font-size="8" fill="#7c3aed" font-weight="700">DERIVED</text>
  <line x1="467" y1="200" x2="604" y2="75" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#d)"/>

  <!-- alignment -->
  <rect x="605" y="155" width="148" height="66" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="679" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#111">alignment</text>
  <text x="679" y="191" text-anchor="middle" font-size="9" fill="#333">take→(m_start,m_end)</text>
  <text x="679" y="205" text-anchor="middle" font-size="9" fill="#333">BLAST + DTW</text>
  <text x="679" y="217" text-anchor="middle" font-size="8" fill="#7c3aed" font-weight="700">DERIVED</text>
  <line x1="467" y1="225" x2="604" y2="195" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#d)"/>

  <!-- coverage -->
  <rect x="605" y="275" width="148" height="66" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="679" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#111">coverage</text>
  <text x="679" y="311" text-anchor="middle" font-size="9" fill="#333">measure→take_count</text>
  <text x="679" y="325" text-anchor="middle" font-size="9" fill="#333">aggregated from takes</text>
  <text x="679" y="337" text-anchor="middle" font-size="8" fill="#7c3aed" font-weight="700">DERIVED</text>
  <line x1="467" y1="250" x2="604" y2="305" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#d)"/>

  <!-- live position -->
  <rect x="605" y="395" width="148" height="66" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="679" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#111">live position</text>
  <text x="679" y="431" text-anchor="middle" font-size="9" fill="#333">current (m, b)</text>
  <text x="679" y="445" text-anchor="middle" font-size="9" fill="#333">ephemeral, from follower</text>
  <text x="679" y="457" text-anchor="middle" font-size="8" fill="#7c3aed" font-weight="700">DERIVED (ephemeral)</text>
  <line x1="467" y1="265" x2="604" y2="415" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#d)"/>

  <!-- INVARIANTS -->
  <rect x="175" y="400" width="405" height="88" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="378" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c">INVARIANTS</text>
  <text x="185" y="438" font-size="9" fill="#555">• pages(score.pdf) == pages(score.mxl)  ← hard-fail if violated</text>
  <text x="185" y="453" font-size="9" fill="#555">• measure numbers identical across score.mxl and measure_boxes</text>
  <text x="185" y="468" font-size="9" fill="#555">• alignment m_start/m_end within score.mxl measure range</text>
  <text x="185" y="483" font-size="9" fill="#555">• coverage re-derived fresh; never stored independently of aligned takes</text>
</svg>
