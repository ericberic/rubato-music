# Local secret scanning: block secrets before they are ever committed, in the
# private repo as well as the public one. Install once per clone/worktree:
#
#   uv tool install pre-commit      # or: pipx install pre-commit
#   pre-commit install
#
# Then gitleaks runs automatically on `git commit`. Update the pinned version
# with `pre-commit autoupdate`. Run against all files on demand with
# `pre-commit run --all-files` (or `make secrets-scan` for a full history scan).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
